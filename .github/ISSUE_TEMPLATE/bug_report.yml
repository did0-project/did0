name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, **do not open an issue**. Follow [SECURITY.md](../blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: did0 version
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version, OS and CPU
      placeholder: "Node 22.16, Ubuntu 24.04 x64 (glibc)"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code that triggers the problem. Never paste real mnemonics or private keys.
      render: js
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true
