name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behaviour
  - type: textarea
    id: refs
    attributes:
      label: Specs or reference implementations
      description: Links to standards, pallets or libraries that define the expected output.
