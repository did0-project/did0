name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  validate-and-test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check Zig formatting
        run: zig fmt --check src build.zig

      - name: Run unit & integration tests
        run: npm test

  build-and-release:
    name: Build Multi-Platform & Publish
    needs: validate-and-test
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Cross-compile all platform targets
        run: node scripts/build-platforms.js --all

      - name: Run smoke test
        run: node tests/smoke-test.js

      - name: Prepare scoped platform packages
        run: node scripts/prepare-platform-packages.js

      - name: Generate SHA-256 Checksums
        run: |
          cd prebuilds
          shasum -a 256 *.node > ../checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            prebuilds/*.node
            checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Scoped Platform Packages to npm
        run: |
          # Idempotent and tolerant of npm's "409 Conflict" while it is still processing
          # the previous brand-new package: skip versions that already exist, retry with backoff.
          for dir in npm/*; do
            [ -d "$dir" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published, skipping"
              continue
            fi
            for attempt in 1 2 3 4 5 6; do
              echo "Publishing $name@$version (attempt $attempt)..."
              if (cd "$dir" && npm publish --access public --provenance); then
                break
              fi
              if [ "$attempt" -eq 6 ]; then
                echo "Failed to publish $name@$version"
                exit 1
              fi
              sleep $((attempt * 15))
            done
            sleep 10
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Link platform packages as optionalDependencies
        run: node scripts/prepare-platform-packages.js --inject-optional

      - name: Publish Core did0 Package to npm
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm publish --provenance --access public; then
              exit 0
            fi
            [ "$attempt" -eq 6 ] && exit 1
            sleep $((attempt * 15))
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
