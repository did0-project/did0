name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Check Zig formatting
        run: zig fmt --check src build.zig

      - name: Run Zig Unit Tests
        run: npm run test:unit

      - name: Build Native Addon (ReleaseFast)
        run: npm run build:release

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Verify the npm package contents
        run: npm pack --dry-run

  cross-compile:
    name: Cross-compile all platform targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Build all six targets
        run: node scripts/build-platforms.js --all

      - name: Check that every binary exists
        run: |
          for t in darwin-arm64 darwin-x64 linux-x64-gnu linux-x64-musl linux-arm64-gnu linux-arm64-musl; do
            test -s "prebuilds/did0.$t.node" || { echo "missing prebuilds/did0.$t.node"; exit 1; }
          done
